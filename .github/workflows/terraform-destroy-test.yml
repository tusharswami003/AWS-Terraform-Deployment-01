name: Destroy EKS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  Destroy_Root_argocd:
    name: Destroy Root Argo CD
    runs-on: ubuntu-latest
    environment: test

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::190944421381:role/github-actions-terraform-dev
          aws-region: ap-south-1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5

      - name: Configure EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name test-eks-cluster

      # Capture both ALB ARNs before deleting either Ingress.
      - name: Get ALB details
        id: alb
        shell: bash
        run: |
          get_alb_arn() {
            local ingress_name="$1"
            local namespace="$2"
            local dns
            local arn

            dns=$(kubectl get ingress "$ingress_name" \
              -n "$namespace" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
              2>/dev/null || true)

            if [[ -z "$dns" ]]; then
              echo "No ALB hostname found for $namespace/$ingress_name" >&2
              printf ''
              return 0
            fi

            echo "Ingress $namespace/$ingress_name DNS: $dns" >&2

            arn=$(aws elbv2 describe-load-balancers \
              --region ap-south-1 \
              --query "LoadBalancers[?DNSName=='${dns}'].LoadBalancerArn | [0]" \
              --output text)

            if [[ "$arn" == "None" ]]; then
              arn=""
            fi

            printf '%s' "$arn"
          }

          NORMAL_ALB_ARN=$(get_alb_arn tushar-web tushar-web)
          DOCKER_ALB_ARN=$(get_alb_arn tushar-web-docker tushar-web-docker)

          echo "Normal app ALB ARN: ${NORMAL_ALB_ARN:-not found}"
          echo "Docker app ALB ARN: ${DOCKER_ALB_ARN:-not found}"

          echo "normal_alb_arn=$NORMAL_ALB_ARN" >> "$GITHUB_OUTPUT"
          echo "docker_alb_arn=$DOCKER_ALB_ARN" >> "$GITHUB_OUTPUT"

      # Detach the root Application so it doesn't control child deletion.
      - name: Stop GitOps reconciliation
        run: |
          kubectl patch application test-platform \
            -n argocd \
            --type merge \
            -p '{"metadata":{"finalizers":null}}' \
            || true

          kubectl delete application test-platform \
            -n argocd \
            --ignore-not-found \
            --wait=true \
            --timeout=5m

      # Delete both child Applications while the ALB controller is running.
      - name: Delete normal and Docker applications
        run: |
          kubectl delete application tushar-web \
            -n argocd \
            --ignore-not-found \
            --wait=true \
            --timeout=15m

          kubectl delete application tushar-web-docker \
            -n argocd \
            --ignore-not-found \
            --wait=true \
            --timeout=15m

      # Do not delete the controller until both ALBs are gone.
      - name: Wait for both ALBs to be deleted
        env:
          NORMAL_ALB_ARN: ${{ steps.alb.outputs.normal_alb_arn }}
          DOCKER_ALB_ARN: ${{ steps.alb.outputs.docker_alb_arn }}
        shell: bash
        run: |
          wait_for_alb() {
            local arn="$1"
            local app_name="$2"

            if [[ -z "$arn" || "$arn" == "None" ]]; then
              echo "No ALB ARN captured for $app_name; skipping its waiter."
              return 0
            fi

            echo "Waiting for $app_name ALB to be deleted: $arn"

            aws elbv2 wait load-balancers-deleted \
              --region ap-south-1 \
              --load-balancer-arns "$arn"

            echo "$app_name ALB has been deleted."
          }

          wait_for_alb "$NORMAL_ALB_ARN" "normal app"
          wait_for_alb "$DOCKER_ALB_ARN" "Docker app"

      - name: Delete AWS Load Balancer Controller
        run: |
          kubectl delete application aws-load-balancer-controller \
            -n argocd \
            --ignore-not-found \
            --wait=true \
            --timeout=15m

  terraform:
    name: Terraform Test Destroy
    environment: test
    runs-on: ubuntu-latest
    needs: Destroy_Root_argocd

    defaults:
      run:
        working-directory: environments/test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::190944421381:role/github-actions-terraform-dev
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -destroy

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
