name: Deploy EKS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VAR_alert_sender_email: ${{ secrets.ALERT_SENDER_EMAIL }}

jobs:
  terraform:
    name: Terraform Test Deploy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::190944421381:role/github-actions-terraform-dev
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  bootstrap-argocd:
    name: Bootstrap Argo CD
    runs-on: ubuntu-latest
    environment: test

    needs: terraform

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::190944421381:role/github-actions-terraform-dev
          aws-region: ap-south-1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Configure EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name test-eks-cluster

      - name: Setup Terraform for SMTP credential retrieval
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Initialize Terraform backend
        working-directory: environments/test
        run: terraform init -input=false

      - name: Create or update Alertmanager SMTP Secret
        working-directory: environments/test
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          smtp_dir=$(mktemp -d)
          export SMTP_DIR="$smtp_dir"
          trap 'rm -rf "$smtp_dir"' EXIT

          terraform output -raw ses_smtp_username > "$smtp_dir/username"
          terraform output -raw ses_smtp_password > "$smtp_dir/password"

          test -s "$smtp_dir/username"
          test -s "$smtp_dir/password"

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          directory = Path(os.environ["SMTP_DIR"])
          email = os.environ["TF_VAR_alert_sender_email"].strip()

          if not email:
              raise SystemExit("Sender email is missing")

          config = {
              "global": {
                  "smtp_smarthost": "email-smtp.ap-south-1.amazonaws.com:587",
                  "smtp_from": email,
                  "smtp_auth_username": (
                      directory / "username"
                  ).read_text().strip(),
                  "smtp_auth_password": (
                      directory / "password"
                  ).read_text().strip(),
                  "smtp_require_tls": True,
              },
              "route": {
                  "receiver": "null",
                  "group_by": ["namespace", "alertname", "severity"],
                  "group_wait": "30s",
                  "group_interval": "5m",
                  "repeat_interval": "6h",

                  "routes": [
                      {
                          "receiver": "ses-email",

                          "matchers": [
                              'alertname=~"NodeCPUHighUsage|NodeMemoryHighUtilization|KubeNodeNotReady|KubeNodePressure|NodeFilesystemSpaceFillingUp|NodeFilesystemAlmostOutOfSpace|NodeFilesystemFilesFillingUp|NodeFilesystemAlmostOutOfFiles"'
                          ],

                          "routes": [
                              {
                                  "receiver": "ses-email",
                                  "matchers": ['severity="critical"'],
                                  "group_wait": "10s",
                                  "repeat_interval": "1h",
                              },
                              {
                                  "receiver": "ses-email",
                                  "matchers": ['severity="warning"'],
                                  "repeat_interval": "6h",
                              },
                          ],
                      }
                  ],
              },

              "receivers": [
                  {"name": "null"},
                  {
                      "name": "ses-email",
                      "email_configs": [
                          {
                              "to": email,
                              "send_resolved": True,
                          }
                      ],
                  },
              ],
          
              "inhibit_rules": [
                  {
                      "source_matchers": [
                          'severity="critical"',
                          'alertname=~"NodeFilesystemSpaceFillingUp|NodeFilesystemAlmostOutOfSpace|NodeFilesystemFilesFillingUp|NodeFilesystemAlmostOutOfFiles"',
                      ],
                      "target_matchers": [
                          'severity="warning"',
                          'alertname=~"NodeFilesystemSpaceFillingUp|NodeFilesystemAlmostOutOfSpace|NodeFilesystemFilesFillingUp|NodeFilesystemAlmostOutOfFiles"',
                      ],
                      "equal": [
                          "alertname",
                          "cluster",
                          "instance",
                          "device",
                          "mountpoint",
                      ],
                  }
              ],
          }

          (directory / "alertmanager.yaml").write_text(
              json.dumps(config, indent=2)
          )
          PY

          kubectl create namespace monitoring \
            --dry-run=client -o yaml \
            | kubectl apply -f -

          kubectl create secret generic alertmanager-ses-smtp \
            --namespace monitoring \
            --from-file=username="$smtp_dir/username" \
            --from-file=password="$smtp_dir/password" \
            --from-file=alertmanager.yaml="$smtp_dir/alertmanager.yaml" \
            --dry-run=client -o yaml \
            | kubectl apply --server-side \
                --field-manager=monitoring-bootstrap -f -

          kubectl describe secret alertmanager-ses-smtp \
            --namespace monitoring

      - name: Add Argo Helm Repository
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

      - name: Install Argo CD
        run: |
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --create-namespace \
            --version 10.9.2 \
            --wait \
            --timeout 10m

      - name: Configure Argo CD private GitHub repository
        shell: bash
        env:
          GITHUB_APP_ID: ${{ secrets.ARGOCD_GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.ARGOCD_GITHUB_APP_INSTALLATION_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.ARGOCD_GITHUB_APP_PRIVATE_KEY }}

        run: |
          kubectl create secret generic eks-platform-config-repo \
            --namespace argocd \
            --from-literal=type=git \
            --from-literal=url=https://github.com/tusharswami003/eks-platform-config.git \
            --from-literal=githubAppID="$GITHUB_APP_ID" \
            --from-literal=githubAppInstallationID="$GITHUB_APP_INSTALLATION_ID" \
            --from-literal=githubAppPrivateKey="$GITHUB_APP_PRIVATE_KEY" \
            --dry-run=client -o yaml \
          | kubectl label --local -f - \
              argocd.argoproj.io/secret-type=repository \
              -o yaml \
          | kubectl apply -f -

      - name: Bootstrap GitOps Root Application
        run: |
          kubectl apply -f environments/test/argocd/bootstrap/root-app.yaml