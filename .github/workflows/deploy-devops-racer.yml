name: Deploy DevOps Racer

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: "Artifact filename in S3"
        required: true
        default: "latest.zip"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

  S3_BUCKET: devops-racer
  S3_PREFIX: artifacts
  ASG_NAME: dev-app-asg

jobs:
  deploy:
    name: Deploy Game to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::190944421381:role/github-actions-terraform-dev
          aws-region: ${{ env.AWS_REGION }}


      - name: Find Application Instances
        id: instances
        shell: bash
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${ASG_NAME}" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)

          echo "Instances found:"
          echo "${INSTANCE_IDS}"

          if [ -z "${INSTANCE_IDS}" ]; then
            echo "No InService instances found in ASG ${ASG_NAME}"
            exit 1
          fi

          echo "instance_ids=${INSTANCE_IDS}" >> "$GITHUB_OUTPUT"

      - name: Verify SSM Connectivity
        shell: bash
        run: |
          for INSTANCE_ID in ${{ steps.instances.outputs.instance_ids }}
          do
            echo "Checking SSM status for ${INSTANCE_ID}"

            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text)

            echo "${INSTANCE_ID}: ${STATUS}"

            if [ "${STATUS}" != "Online" ]; then
              echo "Instance ${INSTANCE_ID} is not Online in SSM"
              exit 1
            fi
          done

      - name: Deploy Application
        id: deploy
        shell: bash
        run: |
          ARTIFACT="${{ github.event.inputs.artifact_name }}"
          INSTANCE_IDS="${{ steps.instances.outputs.instance_ids }}"

          S3_SOURCE="s3://${S3_BUCKET}/${S3_PREFIX}/${ARTIFACT}"

          echo "Deploying ${ARTIFACT}"
          echo "S3 source: ${S3_SOURCE}"
          echo "Target instances: ${INSTANCE_IDS}"

          PARAMETERS=$(jq -nc \
            --arg source "${S3_SOURCE}" \
            '{
              commands: [
                "set -e",
                "echo Starting DevOps Racer deployment",
                "mkdir -p /tmp/devops-racer",
                "rm -rf /tmp/devops-racer/*",
                ("aws s3 cp " + $source + " /tmp/devops-racer/app.zip"),
                "rm -rf /var/www/html/*",
                "unzip -o /tmp/devops-racer/app.zip -d /var/www/html/",
                "nginx -t",
                "systemctl reload nginx",
                "echo Deployment completed successfully"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${INSTANCE_IDS} \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy DevOps Racer ${ARTIFACT}" \
            --parameters "${PARAMETERS}" \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: ${COMMAND_ID}"
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"


      - name: Wait for Deployment
        shell: bash
        run: |

          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"

          echo "Waiting for SSM command ${COMMAND_ID}"

          for INSTANCE_ID in ${{ steps.instances.outputs.instance_ids }}
          do
            echo "Waiting for ${INSTANCE_ID}"

            aws ssm wait command-executed \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}"

            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text)

            echo "${INSTANCE_ID}: ${STATUS}"

            if [ "${STATUS}" != "Success" ]; then

              echo "Deployment failed on ${INSTANCE_ID}"

              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}"

              exit 1
            fi
          done


      - name: Deployment Results
        shell: bash
        run: |

          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"

          for INSTANCE_ID in ${{ steps.instances.outputs.instance_ids }}
          do

            echo ""
            echo "============================================"
            echo "Instance: ${INSTANCE_ID}"
            echo "============================================"

            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'StandardOutputContent' \
              --output text

          done


      # ---------------------------------------------------------
      # 9. Final deployment summary
      # ---------------------------------------------------------
      - name: Deployment Summary
        run: |
          echo "============================================"
          echo "DevOps Racer deployment completed"
          echo "============================================"
          echo ""
          echo "Artifact:"
          echo "${{ github.event.inputs.artifact_name }}"
          echo ""
          echo "S3 Source:"
          echo "s3://${S3_BUCKET}/${S3_PREFIX}/${{ github.event.inputs.artifact_name }}"
          echo ""
          echo "Instances:"
          echo "${{ steps.instances.outputs.instance_ids }}"