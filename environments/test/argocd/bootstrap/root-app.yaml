apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-platform
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/tusharswami003/eks-platform-config.git
    targetRevision: main
    path: test/argocd-apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true